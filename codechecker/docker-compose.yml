name: codechecker

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codechecker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: codechecker
    volumes:
      - codechecker_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codechecker -d codechecker"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - codechecker

  codechecker:
    image: docker.io/codechecker/codechecker-web:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      CODECHECKER_SUPERUSER: ${CODECHECKER_SUPERUSER:?CODECHECKER_SUPERUSER must be set in .env}
      CODECHECKER_SUPERUSER_PASSWORD: ${CODECHECKER_SUPERUSER_PASSWORD:?CODECHECKER_SUPERUSER_PASSWORD must be set in .env}
    volumes:
      - codechecker_workspace:/workspace
      - ./entrypoint.sh:/usr/local/bin/codechecker-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/codechecker-entrypoint.sh"]
    expose:
      - "8001"
    networks:
      - codechecker
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=codechecker_codechecker"
      - "traefik.http.routers.codechecker.rule=Host(`${CODECHECKER_DOMAIN}`)"
      - "traefik.http.routers.codechecker.entrypoints=websecure"
      - "traefik.http.routers.codechecker.tls=true"
      - "traefik.http.routers.codechecker.tls.certresolver=letsencrypt"
      - "traefik.http.services.codechecker.loadbalancer.server.port=8001"

  traefik:
    image: docker.io/library/traefik:v3.2
    restart: unless-stopped
    depends_on:
      - codechecker
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=codechecker_codechecker"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?TRAEFIK_ACME_EMAIL must be set in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - codechecker

networks:
  codechecker:
    driver: bridge

volumes:
  codechecker_db:
  codechecker_workspace:
  traefik_letsencrypt:
