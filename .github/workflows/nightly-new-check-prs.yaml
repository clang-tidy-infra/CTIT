name: Nightly New Checks Analysis

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      since_hours:
        description: 'Activity window in hours'
        default: '24'
      limit:
        description: 'Maximum analysis runs to trigger'
        default: '10'
      include_drafts:
        description: 'Include draft pull requests'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run without creating issues or comments'
        type: boolean
        default: false

permissions: {}

jobs:
  trigger-new-check-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      SINCE_HOURS: ${{ inputs.since_hours }}

    steps:
      - name: Checkout CTIT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Find pull requests adding new clang-tidy checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INCLUDE_DRAFTS: ${{ inputs.include_drafts && 'true' || 'false' }}
        run: |
          args=(--since-hours "${SINCE_HOURS:-24}" --output new-check-prs.json)
          if [ "$INCLUDE_DRAFTS" = true ]; then
            args+=(--include-drafts)
          fi
          python3 -m pr_watcher.find_new_check_prs "${args[@]}"

      - name: Open or refresh CTIT issues
        env:
          GITHUB_TOKEN: ${{ secrets.NIGHTLY_TRIGGER_TOKEN }}
          REPO: ${{ github.repository }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          args=(
            --repo "$REPO"
            --targets new-check-prs.json
            --limit "${LIMIT:-10}"
            --since-hours "${SINCE_HOURS:-24}"
            --summary-file nightly-summary.md
          )
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          python3 -m pr_watcher.sync_issues "${args[@]}"

      - name: Create job summary
        if: always() && hashFiles('nightly-summary.md') != ''
        run: cat nightly-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-new-check-prs
          path: |
            new-check-prs.json
            nightly-summary.md
          if-no-files-found: ignore
