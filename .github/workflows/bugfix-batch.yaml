name: Bugfix Batch Analysis

on:
  # Manual runs only for now. To enable the schedule, uncomment it: four times a
  # day, timed to end before the new-check watcher at 1:00 and 13:00, since both
  # tracks share the one ARM64 runner.
  # schedule:
  #   - cron: '30 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      since_hours:
        description: 'Activity window in hours'
        default: '24'
      limit:
        description: 'Maximum pull requests in the batch'
        default: '10'
      include_drafts:
        description: 'Include draft pull requests'
        type: boolean
        default: false
      dry_run:
        description: 'Run the batch without creating issues or comments'
        type: boolean
        default: false

permissions: {}

# A batch must see the markers the previous one posted.
concurrency:
  group: bugfix-batch
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      has_work: ${{ steps.select.outputs.has_work }}
      checks: ${{ steps.select.outputs.checks }}

    steps:
      - name: Checkout CTIT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      - name: Select pull requests
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SINCE_HOURS: ${{ inputs.since_hours }}
          LIMIT: ${{ inputs.limit }}
          INCLUDE_DRAFTS: ${{ inputs.include_drafts && 'true' || 'false' }}
        run: |
          args=(--repo "$REPO" --since-hours "${SINCE_HOURS:-24}" --limit "${LIMIT:-10}")
          if [ "$INCLUDE_DRAFTS" = true ]; then
            args+=(--include-drafts)
          fi
          python3 -m bugfix_batch.select_batch "${args[@]}"

      - name: Create job summary
        if: always() && hashFiles('batch/plan-summary.md') != ''
        run: cat batch/plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bugfix-batch-plan
          path: batch/

  analyze:
    needs: select
    if: needs.select.outputs.has_work == 'true'
    runs-on: ARM64
    container:
      image: ghcr.io/clang-tidy-infra/ctit-runner:latest # zizmor: ignore[unpinned-images]
      options: --user root
    timeout-minutes: 240
    # This job runs code from pull requests. It holds no secret and cannot
    # write, and restores the shared test-projects cache without saving it.
    permissions:
      contents: read
      packages: read
    outputs:
      artifact_url: ${{ steps.upload-logs.outputs.artifact-url }}

    env:
      CTIT_JOBS: "48"
      SCCACHE_GHA_ENABLED: "true"
      LLVM_SYMBOLIZER_PATH: ${{ github.workspace }}/llvm-project/build/bin/llvm-symbolizer
      CLANG_TIDY_BINARY: llvm-project/build/bin/clang-tidy
      RUN_TIDY_SCRIPT: llvm-project/clang-tools-extra/clang-tidy/tool/run-clang-tidy.py

    steps:
      - name: Checkout CTIT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare LLVM submodule
        run: |
          git config --global --add safe.directory '*'
          git -C llvm-project checkout .
          git -C llvm-project clean -fdx

      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bugfix-batch-plan
          path: batch

      - name: Restore test-projects cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test_projects
          key: test-projects-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('testers/projects.json') }}

      - name: Clone test projects
        run: ./ctit.py clone --work-dir test_projects

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build baseline clang-tidy
        run: bash build.sh

      - name: Configure test projects
        run: ./ctit.py configure

      - name: Run clang-tidy on unpatched LLVM
        env:
          CHECK_NAME: ${{ needs.select.outputs.checks }}
        run: >
          ./ctit.py analyze
          --check-name "$CHECK_NAME"
          --clang-tidy-binary "$CLANG_TIDY_BINARY"
          --run-tidy-script "$RUN_TIDY_SCRIPT"
          --log-dir logs/baseline

      - name: Apply patches and build clang-tidy
        id: build
        run: python3 -m bugfix_batch.build_batch

      - name: Run clang-tidy on patched LLVM
        if: steps.build.outputs.checks != ''
        env:
          CHECK_NAME: ${{ steps.build.outputs.checks }}
        run: >
          ./ctit.py analyze
          --check-name "$CHECK_NAME"
          --clang-tidy-binary "$CLANG_TIDY_BINARY"
          --run-tidy-script "$RUN_TIDY_SCRIPT"

      - name: Upload logs
        id: upload-logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bugfix-batch-logs
          path: |
            logs/
            batch/build.json

  publish:
    needs: analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The only job that writes, and it runs no code from pull requests. It must
    # stay on github.token: issues and labels made with it start no workflow,
    # so this track cannot trigger check-tester.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout CTIT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bugfix-batch-logs

      - name: Post results to issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.analyze.outputs.artifact_url }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          args=(--repo "$REPO" --run-url "$RUN_URL" --artifact-url "$ARTIFACT_URL")
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          python3 -m bugfix_batch.publish_batch "${args[@]}"

      - name: Create job summary
        if: always() && hashFiles('batch/publish-summary.md') != ''
        run: cat batch/publish-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bugfix-batch-reports
          path: batch/reports/
          if-no-files-found: ignore
