name: Daily Check Timings

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check-timings:
    runs-on: ARM64
    container:
      image: ghcr.io/clang-tidy-infra/ctit-runner:latest # zizmor: ignore[unpinned-images]
      options: --user root
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
      packages: read

    env:
      CTIT_JOBS: "48"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_LOG: sccache::server=debug,sccache::cache=warn
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/logs/sccache/server.log
      LLVM_SYMBOLIZER_PATH: ${{ github.workspace }}/llvm-project/build/bin/llvm-symbolizer

    steps:
      - name: Checkout CTIT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare LLVM submodule
        run: |
          git config --global --add safe.directory '*'
          git -C llvm-project checkout .
          git -C llvm-project clean -fdx

      - name: Restore test-projects cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test_projects
          key: test-projects-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('testers/projects.json') }}

      - name: Clone test projects
        run: ./ctit.py clone --work-dir test_projects

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Start sccache
        run: |
          mkdir -p logs/sccache
          sccache --start-server

      - name: Build clang-tidy
        run: bash build.sh

      - name: Configure test projects
        run: ./ctit.py configure

      - name: Run clang-tidy with all checks
        run: >
          ./ctit.py analyze
          --check-name "*,-clang-analyzer-*,-bugprone-unchecked-optional-access,-abseil-unchecked-statusor-access"
          --clang-tidy-binary llvm-project/build/bin/clang-tidy
          --run-tidy-script llvm-project/clang-tools-extra/clang-tidy/tool/run-clang-tidy.py
          --skip-headers
          --enable-check-profile

      - name: Parse check timings profile
        run: python3 crash_detection/parse_check_profile.py --log-dir logs/ --output profile-report.md

      - name: Generate public timings record
        run: >
          python3 -m crash_detection.timings_result
          --log-dir logs/
          --llvm-revision "$(git -C llvm-project rev-parse HEAD)"
          --runner "$RUNNER_NAME"
          --runner-arch "$RUNNER_ARCH"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output ctit-timings.json

      - name: Post check timings to tracking issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUNNER: ${{ runner.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          python3 -m crash_detection.post_check_timings
          --repo "$REPO"
          --log-dir logs/
          --llvm-revision "$(git -C llvm-project rev-parse HEAD)"
          --runner "$RUNNER"
          --run-url "$RUN_URL"
          --output check-timings-comment.md

      - name: Upload check timings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: check-timings
          path: |
            logs/
            profile-report.md
            profile-report-detailed.md
            check-timings-comment.md
            ctit-timings.json

      - name: Checkout public results repository
        if: always() && hashFiles('ctit-timings.json') != '' && vars.CTIT_RESULTS_REPOSITORY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.CTIT_RESULTS_REPOSITORY }}
          token: ${{ secrets.CTIT_RESULTS_TOKEN }}
          path: ctit-results
          persist-credentials: false

      - name: Publish public timings record
        if: always() && hashFiles('ctit-timings.json') != '' && vars.CTIT_RESULTS_REPOSITORY != ''
        working-directory: ctit-results
        env:
          GH_TOKEN: ${{ secrets.CTIT_RESULTS_TOKEN }}
        run: |
          DATE=$(python3 -c 'import json; print(json.load(open("../ctit-timings.json"))["date"])')
          RECORD_PATH="timings/$(echo "$DATE" | cut -c1-7 | tr - /)/$DATE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RUNNER_ARCH.json"
          mkdir -p "$(dirname "$RECORD_PATH")"
          cp ../ctit-timings.json "$RECORD_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add "$RECORD_PATH"
          git commit -m "timings: run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT $RUNNER_ARCH"
          git pull --rebase
          git push
