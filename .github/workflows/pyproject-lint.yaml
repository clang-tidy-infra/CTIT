name: Validate pyproject config

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - '.github/workflows/*.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - '.github/workflows/*.yaml'

permissions: {}

jobs:
  validate-pyproject:
    permissions:
      contents: read
    uses: clang-tidy-infra/workflows/.github/workflows/pyproject-lint.yaml@b15c6951afee28ead3e089df43c3126e72845bb1 # v1.0.0
