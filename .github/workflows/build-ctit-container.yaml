name: Build CTIT Runner Container

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-ctit-container.yaml
      - .github/workflows/containers/ctit-runner/**
  pull_request:
    paths:
      - .github/workflows/build-ctit-container.yaml
      - .github/workflows/containers/ctit-runner/**
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/clang-tidy-infra/ctit-runner

jobs:
  build:
    if: github.repository_owner == 'clang-tidy-infra'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Tag Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/workflows/containers/ctit-runner/
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ctit-runner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ctit-runner-${{ matrix.arch }}

      - name: Test image
        run: bash tests/test_container.sh "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

      - name: Push image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: docker push --all-tags ${{ env.IMAGE_NAME }}

  publish:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Tag Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Publish multi-platform image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE_NAME:$BUILD_TAG-amd64" \
            "$IMAGE_NAME:$BUILD_TAG-arm64"
